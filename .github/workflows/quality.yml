name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/xrp-engine-foundation-v0.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff
          fi
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Format
        run: ruff format --check src tests scripts
      - name: Tests
        run: python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml
      - name: Read-only execution boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = {
              "submit_order",
              "place_order",
              "execute_trade",
              "sign_transaction",
              "wallet_seed",
              "private_key",
          }
          violations = []
          for path in Path("src").rglob("*.py"):
              text = path.read_text(encoding="utf-8", errors="ignore").lower()
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}:{token}")
          if violations:
              raise SystemExit("Forbidden execution surface: " + ", ".join(violations))
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.python-version }}
          path: reports/junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  package:
    name: Package build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Inspect distributions
        run: python -m zipfile -l dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  security:
    name: Security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Static security analysis
        run: bandit -q -r src/xrp_regime_engine
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r <(python -m pip freeze) || true
      - name: Detect committed secret material
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = {
              "private_key_block": re.compile(r"BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY"),
              "github_token": re.compile(r"gh[pousr]_[A-Za-z0-9]{30,}"),
              "aws_access_key": re.compile(r"AKIA[0-9A-Z]{16}"),
          }
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      violations.append(f"{path}:{name}")
          if violations:
              raise SystemExit("Potential secrets committed: " + ", ".join(violations))
          PY

  advisory-types:
    name: Type-debt visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . mypy
      - name: Type check
        run: mypy src/xrp_regime_engine
