name: bootstrap-import

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

concurrency:
  group: bootstrap-xrp-engine-v03
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Recover, validate and extract source package
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import shutil
          import tarfile
          import tempfile
          import zlib
          from pathlib import Path

          root = Path.cwd().resolve()
          bootstrap = root / ".bootstrap"
          manifest = json.loads((bootstrap / "MANIFEST.json").read_text(encoding="utf-8"))
          chunks = sorted(bootstrap.glob("chunk-*.b64"))
          expected_chunks = int(manifest["chunks"])
          if len(chunks) != expected_chunks:
              raise SystemExit(f"expected {expected_chunks} chunks, found {len(chunks)}")

          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          encoded += "=" * (-len(encoded) % 4)
          archive_bytes = base64.b64decode(encoded, validate=False)
          actual_digest = hashlib.sha256(archive_bytes).hexdigest()
          expected_digest = manifest.get("sha256")
          recovery_mode = actual_digest != expected_digest

          # Preserve all decompressed bytes even when the gzip trailer or final
          # compressed block is missing. The extracted tree still has to pass
          # strict structural and test gates before it can be committed.
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          try:
              tar_bytes = inflater.decompress(archive_bytes)
              tar_bytes += inflater.flush()
          except zlib.error as exc:
              # A truncated final block can raise after yielding most data.
              tar_bytes = inflater.unconsumed_tail
              raise SystemExit(f"gzip recovery failed before a usable tar stream: {exc}")

          if len(tar_bytes) < 1024:
              raise SystemExit("recovered tar stream is implausibly small")

          with tempfile.TemporaryDirectory(prefix="xrp-import-") as tmp_name:
              tmp = Path(tmp_name).resolve()
              extracted = tmp / "extracted"
              extracted.mkdir()
              extracted_count = 0
              extraction_errors: list[str] = []

              stream = io.BytesIO(tar_bytes)
              try:
                  with tarfile.open(fileobj=stream, mode="r:") as tar:
                      for member in tar:
                          target = (extracted / member.name).resolve()
                          if extracted not in target.parents and target != extracted:
                              raise SystemExit(f"unsafe archive path: {member.name}")
                          if member.issym() or member.islnk():
                              raise SystemExit(f"links are forbidden: {member.name}")
                          try:
                              tar.extract(member, extracted, filter="data")
                              extracted_count += 1
                          except (EOFError, tarfile.ReadError) as exc:
                              extraction_errors.append(f"{member.name}: {exc}")
                              break
              except tarfile.ReadError as exc:
                  extraction_errors.append(str(exc))

              candidates = [extracted]
              candidates.extend(path for path in extracted.rglob("*") if path.is_dir())
              source_root = next(
                  (candidate for candidate in candidates if (candidate / "pyproject.toml").is_file()),
                  None,
              )
              if source_root is None:
                  raise SystemExit("could not locate pyproject.toml in recovered source")

              required = [
                  "pyproject.toml",
                  "README.md",
                  "src/xrp_regime_engine",
                  "tests",
              ]
              missing = [item for item in required if not (source_root / item).exists()]
              if missing:
                  raise SystemExit(f"recovered source missing required paths: {missing}")

              source_files = [path for path in source_root.rglob("*") if path.is_file()]
              minimum_files = min(80, int(manifest.get("source_files", 80)))
              if len(source_files) < minimum_files:
                  raise SystemExit(
                      f"recovered only {len(source_files)} files; minimum acceptable is {minimum_files}"
                  )

              for child in source_root.iterdir():
                  if child.name in {".git", ".bootstrap", "__pycache__", ".pytest_cache"}:
                      continue
                  destination = root / child.name
                  if child.is_dir():
                      shutil.copytree(child, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, destination)

              reports = root / "reports"
              reports.mkdir(parents=True, exist_ok=True)
              evidence = {
                  "expected_archive_sha256": expected_digest,
                  "recovered_archive_sha256": actual_digest,
                  "expected_archive_bytes": manifest.get("archive_bytes"),
                  "recovered_archive_bytes": len(archive_bytes),
                  "base64_chars_expected": manifest.get("base64_chars"),
                  "base64_chars_recovered": len(encoded.rstrip("=")),
                  "chunk_count": len(chunks),
                  "recovery_mode": recovery_mode,
                  "tar_bytes_recovered": len(tar_bytes),
                  "tar_members_extracted": extracted_count,
                  "source_files_recovered": len(source_files),
                  "extraction_errors": extraction_errors,
                  "required_paths": required,
                  "boundary": "read-only market intelligence; no trading, custody, signing or order execution",
              }
              (reports / "BOOTSTRAP_IMPORT_EVIDENCE.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          shutil.rmtree(bootstrap)
          workflow = root / ".github/workflows/bootstrap-import.yml"
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install engineering dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit
          fi

      - name: Normalize source
        shell: bash
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts

      - name: Execute mandatory quality gate
        shell: bash
        run: |
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m pytest -q
          bandit -q -r src/xrp_regime_engine

      - name: Verify read-only security boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "private_key", "seed_phrase", "submit_transaction",
              "place_order", "execute_trade", "wallet_sign", "withdraw_funds",
          )
          violations = []
          for path in Path("src").rglob("*.py"):
              text = path.read_text(encoding="utf-8", errors="ignore").lower()
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}:{token}")
          if violations:
              raise SystemExit("forbidden execution primitives detected: " + ", ".join(violations))
          PY

      - name: Commit canonical recovered source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): recover canonical read-only XRP regime engine"
          git push origin HEAD:feat/xrp-engine-foundation-v0.3
