name: bootstrap-import

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

concurrency:
  group: bootstrap-xrp-engine-v03
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Reconstruct audited source package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import shutil
          import tarfile

          root = Path.cwd().resolve()
          bootstrap = root / ".bootstrap"
          manifest = json.loads((bootstrap / "MANIFEST.json").read_text(encoding="utf-8"))
          chunks = sorted(bootstrap.glob("chunk-*.b64"))
          if len(chunks) != manifest["chunks"]:
              raise SystemExit(f"expected {manifest['chunks']} chunks, found {len(chunks)}")
          encoded = "".join(path.read_text(encoding="ascii") for path in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive_bytes).hexdigest()
          if digest != manifest["sha256"]:
              raise SystemExit(f"archive hash mismatch: {digest}")
          archive = bootstrap / "source.tar.gz"
          archive.write_bytes(archive_bytes)
          with tarfile.open(archive, "r:gz") as tar:
              for member in tar.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"links are forbidden in bootstrap archive: {member.name}")
              tar.extractall(root, filter="data")
          shutil.rmtree(bootstrap)
          Path(".github/workflows/bootstrap-import.yml").unlink()
          PY

      - name: Install engineering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Normalize and verify imported source
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts
          python -m compileall -q src tests scripts
          python -m pytest -q
          python -m xrp_regime_engine.cli demo --output state/bootstrap-demo
          python -m xrp_regime_engine.cli verify --output state/bootstrap-verification.json

      - name: Commit canonical source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): import read-only XRP regime intelligence engine"
          git push origin HEAD:feat/xrp-engine-foundation-v0.3
