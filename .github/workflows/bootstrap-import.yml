name: bootstrap-import

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

concurrency:
  group: bootstrap-xrp-engine-v03
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Reconstruct and validate source package
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import base64
          import hashlib
          import json
          import shutil
          import tarfile
          import tempfile

          root = Path.cwd().resolve()
          bootstrap = root / ".bootstrap"
          manifest_path = bootstrap / "MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          chunks = sorted(bootstrap.glob("chunk-*.b64"))
          expected_chunks = int(manifest["chunks"])
          if len(chunks) != expected_chunks:
              raise SystemExit(
                  f"expected {expected_chunks} chunks, found {len(chunks)}"
              )

          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive_bytes).hexdigest()
          expected_digest = manifest.get("sha256")
          if expected_digest and digest != expected_digest:
              raise SystemExit(
                  f"archive hash mismatch: expected {expected_digest}, got {digest}"
              )

          with tempfile.TemporaryDirectory(prefix="xrp-import-") as tmp_name:
              tmp = Path(tmp_name).resolve()
              archive = tmp / "source.tar.gz"
              archive.write_bytes(archive_bytes)

              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  for member in members:
                      target = (tmp / member.name).resolve()
                      if tmp not in target.parents and target != tmp:
                          raise SystemExit(f"unsafe archive path: {member.name}")
                      if member.issym() or member.islnk():
                          raise SystemExit(
                              f"links are forbidden in bootstrap archive: {member.name}"
                          )
                  tar.extractall(tmp, filter="data")

              candidates = [tmp]
              candidates.extend(path for path in tmp.iterdir() if path.is_dir())
              source_root = next(
                  (candidate for candidate in candidates if (candidate / "pyproject.toml").is_file()),
                  None,
              )
              if source_root is None:
                  raise SystemExit("could not locate pyproject.toml in reconstructed source")

              required = manifest.get(
                  "required_paths",
                  ["pyproject.toml", "README.md", "src/xrp_regime_engine", "tests"],
              )
              missing = [item for item in required if not (source_root / item).exists()]
              if missing:
                  raise SystemExit(f"reconstructed source missing required paths: {missing}")

              for child in source_root.iterdir():
                  if child.name in {".git", ".bootstrap"}:
                      continue
                  destination = root / child.name
                  if child.is_dir():
                      shutil.copytree(child, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, destination)

              evidence_dir = root / "reports"
              evidence_dir.mkdir(parents=True, exist_ok=True)
              source_files = [path for path in source_root.rglob("*") if path.is_file()]
              evidence = {
                  "archive_sha256": digest,
                  "archive_bytes": len(archive_bytes),
                  "chunk_count": len(chunks),
                  "source_file_count": len(source_files),
                  "required_paths": required,
                  "source_root": source_root.name,
                  "mode": "one-time-recovery-import",
              }
              (evidence_dir / "BOOTSTRAP_IMPORT_EVIDENCE.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          shutil.rmtree(bootstrap)
          workflow = root / ".github/workflows/bootstrap-import.yml"
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install engineering dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit
          fi

      - name: Normalize imported source
        shell: bash
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts

      - name: Execute local-equivalent quality gate
        shell: bash
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q
          if python -m xrp_regime_engine.cli --help >/dev/null 2>&1; then
            python -m xrp_regime_engine.cli demo --output state/bootstrap-demo || true
            python -m xrp_regime_engine.cli verify --output state/bootstrap-verification.json || true
          fi
          bandit -q -r src/xrp_regime_engine

      - name: Commit canonical source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): import read-only XRP regime intelligence engine"
          git push origin HEAD:feat/xrp-engine-foundation-v0.3
