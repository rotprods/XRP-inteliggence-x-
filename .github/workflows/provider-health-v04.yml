name: provider-health-v04

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [feat/v0.4-live-provider-plane]
    paths:
      - .provider-live/READY

permissions:
  contents: read
  issues: write

env:
  REPORT: reports/live-provider-health-v04.json

concurrency:
  group: provider-health-v04
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install read-only provider plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install httpx
      - name: Execute public read-only probe
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p reports
          python scripts/probe_public_providers_v04.py --output "$REPORT" --require-consensus
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-health-v04-${{ github.run_id }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 30
      - name: Open or update sustained provider-health blocker
        if: steps.probe.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE='[P0] Live provider consensus is degraded'
          SUMMARY=$(python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/live-provider-health-v04.json').read_text())
          failed=[p['provider'] for p in report['providers'] if p['status'] != 'HEALTHY']
          blocked=[name for name,value in report['consensus'].items() if value['status'] != 'PASS']
          print(f"healthy={report['healthy_provider_count']}; failed={failed}; blocked_consensus={blocked}")
          PY
          )
          BODY=$(cat <<EOF
          Public read-only provider consensus did not satisfy the minimum independent-source gate.

          ${SUMMARY}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This is a data-quality blocker, not an instruction to weaken the consensus threshold. Validate regional availability, substitute providers or document a controlled degradation policy.
          EOF
          )
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label 'priority:p0,area:data,gate:needs-evidence'
          fi
      - name: Fail when no quote group has independent consensus
        if: steps.probe.outputs.status != '0'
        run: exit 1
