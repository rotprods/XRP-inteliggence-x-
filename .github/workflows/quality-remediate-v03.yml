name: quality-remediate-v03

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .quality/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xrp-quality-remediate-v03
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Assert canonical source exists
        run: |
          test -f pyproject.toml
          test -d src/xrp_regime_engine
          test -d tests

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit pip-audit
          fi

      - name: Apply deterministic mechanical remediation
        shell: bash
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts
          rm -rf .quality
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(quality): apply deterministic formatting and lint fixes' || true
          git push origin HEAD:feat/xrp-engine-foundation-v0.3

      - name: Execute gates and persist machine-readable evidence
        shell: bash
        run: |
          set +e
          mkdir -p reports
          python -m compileall -q src tests scripts; COMPILE=$?
          ruff check src tests scripts; RUFF=$?
          ruff format --check src tests scripts; FORMAT=$?
          python -m pytest --cov=xrp_regime_engine --cov-report=term-missing -q; PYTEST=$?
          mypy src/xrp_regime_engine; MYPY=$?
          bandit -q -r src/xrp_regime_engine; BANDIT=$?
          pip-audit; AUDIT=$?
          python - <<PY
          import json
          from pathlib import Path
          gates = {
              'compileall': $COMPILE,
              'ruff': $RUFF,
              'format': $FORMAT,
              'pytest': $PYTEST,
              'mypy': $MYPY,
              'bandit': $BANDIT,
              'pip_audit': $AUDIT,
          }
          payload = {
              'gates': gates,
              'required_pass': ['compileall', 'ruff', 'format', 'pytest', 'bandit'],
              'required_status': 'PASS' if all(gates[k] == 0 for k in ['compileall','ruff','format','pytest','bandit']) else 'FAIL',
              'advisory_status': 'PASS' if gates['mypy'] == 0 and gates['pip_audit'] == 0 else 'WARN',
              'production_release': 'BLOCKED',
              'boundary': 'read-only market intelligence; no trading, custody, signing, private keys or order execution',
          }
          Path('reports/REMOTE_QUALITY_GATE_V03.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git add reports/REMOTE_QUALITY_GATE_V03.json
          git commit -m 'chore(quality): persist remote quality-gate evidence' || true
          git push origin HEAD:feat/xrp-engine-foundation-v0.3
          if [ "$COMPILE" -ne 0 ] || [ "$RUFF" -ne 0 ] || [ "$FORMAT" -ne 0 ] || [ "$PYTEST" -ne 0 ] || [ "$BANDIT" -ne 0 ]; then
            exit 1
          fi
