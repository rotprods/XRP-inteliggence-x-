name: bootstrap-recover-v2

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/READY2

permissions:
  contents: write

concurrency:
  group: bootstrap-xrp-engine-recover-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Recover structurally valid source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, io, json, shutil, tarfile, tempfile, zlib
          from pathlib import Path

          root = Path.cwd().resolve()
          boot = root / '.bootstrap'
          manifest = json.loads((boot / 'MANIFEST.json').read_text())
          chunks = sorted(boot.glob('chunk-*.b64'))
          if len(chunks) != int(manifest['chunks']):
              raise SystemExit(f'chunk count mismatch: {len(chunks)}')

          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          raw_chars = len(encoded)
          encoded += '=' * (-len(encoded) % 4)
          compressed = base64.b64decode(encoded, validate=False)
          actual_sha = hashlib.sha256(compressed).hexdigest()

          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          tar_bytes = inflater.decompress(compressed)
          try:
              tar_bytes += inflater.flush()
          except zlib.error:
              pass
          if len(tar_bytes) < 4096:
              raise SystemExit(f'insufficient recovered tar bytes: {len(tar_bytes)}')

          with tempfile.TemporaryDirectory(prefix='xrp-recover-') as td:
              td = Path(td).resolve()
              extracted = td / 'tree'
              extracted.mkdir()
              members = 0
              errors = []
              try:
                  with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tar:
                      while True:
                          try:
                              member = tar.next()
                          except (EOFError, tarfile.ReadError) as exc:
                              errors.append(str(exc)); break
                          if member is None:
                              break
                          target = (extracted / member.name).resolve()
                          if extracted not in target.parents and target != extracted:
                              raise SystemExit(f'unsafe path: {member.name}')
                          if member.issym() or member.islnk():
                              raise SystemExit(f'link forbidden: {member.name}')
                          try:
                              tar.extract(member, extracted, filter='data')
                              members += 1
                          except (EOFError, tarfile.ReadError) as exc:
                              errors.append(f'{member.name}: {exc}'); break
              except tarfile.ReadError as exc:
                  errors.append(str(exc))

              candidates = [extracted] + [p for p in extracted.rglob('*') if p.is_dir()]
              source = next((p for p in candidates if (p / 'pyproject.toml').is_file()), None)
              if source is None:
                  raise SystemExit('pyproject.toml not recovered')
              required = ['pyproject.toml', 'README.md', 'src/xrp_regime_engine', 'tests']
              missing = [p for p in required if not (source / p).exists()]
              if missing:
                  raise SystemExit(f'missing required paths: {missing}')
              files = [p for p in source.rglob('*') if p.is_file()]
              if len(files) < 80:
                  raise SystemExit(f'only {len(files)} source files recovered')

              for child in source.iterdir():
                  if child.name in {'.git', '.bootstrap', '__pycache__', '.pytest_cache'}:
                      continue
                  dst = root / child.name
                  if child.is_dir():
                      shutil.copytree(child, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(child, dst)

              reports = root / 'reports'
              reports.mkdir(exist_ok=True)
              evidence = {
                  'expected_sha256': manifest.get('sha256'),
                  'actual_truncated_sha256': actual_sha,
                  'expected_base64_chars': manifest.get('base64_chars'),
                  'recovered_base64_chars': raw_chars,
                  'compressed_bytes': len(compressed),
                  'tar_bytes': len(tar_bytes),
                  'tar_members': members,
                  'source_files': len(files),
                  'recovery_errors': errors,
                  'structural_gate': 'PASS',
                  'production_release': 'BLOCKED',
              }
              (reports / 'BOOTSTRAP_RECOVERY_EVIDENCE.json').write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + '\n'
              )

          # Remove transport-only artifacts and both one-time workflows.
          shutil.rmtree(boot)
          for workflow in (
              root / '.github/workflows/bootstrap-import.yml',
              root / '.github/workflows/bootstrap-recover-v2.yml',
          ):
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Commit recovered canonical tree before quality evaluation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(core): publish structurally validated XRP engine source'
          git push origin HEAD:feat/xrp-engine-foundation-v0.3

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit
          fi

      - name: Normalize and test
        shell: bash
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m pytest -q
          bandit -q -r src/xrp_regime_engine

      - name: Commit normalized tree and quality evidence
        if: success()
        shell: bash
        run: |
          mkdir -p reports
          printf '{"remote_quality_gate":"PASS","production_release":"BLOCKED"}\n' > reports/REMOTE_QUALITY_GATE.json
          git add -A
          git commit -m 'chore(quality): normalize source and record passing remote gate' || true
          git push origin HEAD:feat/xrp-engine-foundation-v0.3
