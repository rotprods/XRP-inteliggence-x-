name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build pytest cyclonedx-bom
      - name: Verify release candidate
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/verify_read_only_boundary.py
      - name: Build distributions
        run: python -m build
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          cyclonedx-py environment --output-file dist/SBOM.cdx.json
          (cd dist && sha256sum * > SHA256SUMS.txt)
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          manifest = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "mode": "read-only-market-intelligence",
              "production_release": "requires explicit release-gate evidence",
              "artifacts": sorted(path.name for path in Path("dist").iterdir()),
          }
          Path("dist/BUILD_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish immutable GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
