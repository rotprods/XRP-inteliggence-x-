name: promote-pr-v03

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: promote-pr-v03
  cancel-in-progress: true

jobs:
  promote:
    if: ${{ hashFiles('reports/FINALIZATION_V03.json') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest ruff bandit build
          fi
      - name: Required promotion gate
        run: |
          test ! -d .bootstrap
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m pytest -q
          python scripts/verify_read_only_boundary.py
          bandit -q -r src/xrp_regime_engine
          python -m build
      - name: Mark PR ready with evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready 1 --repo rotprods/XRP-inteliggence-x-
          gh pr comment 1 --repo rotprods/XRP-inteliggence-x- --body "Promotion gate passed on commit $GITHUB_SHA: bootstrap removed; compile, lint, format, tests, read-only boundary, Bandit and package build all passed. The PR is ready for review. Production release remains BLOCKED by live-provider, point-in-time calibration, 30-day shadow and SLO gates."
