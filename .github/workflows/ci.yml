name: verification-os

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'schemas/**'
      - 'docs/verification/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Verification depth
        required: true
        default: fast
        type: choice
        options:
          - fast
          - deep
          - release

permissions:
  contents: read

concurrency:
  group: verification-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'pull_request' && 'FAST' || inputs.profile }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_PROFILE: ${{ github.event_name == 'pull_request' && 'fast' || inputs.profile }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: src
      TZ: UTC
      SOURCE_DATE_EPOCH: '1704067200'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Start cost clock
        shell: bash
        run: echo "CI_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FAST verification dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install DEEP / RELEASE dependencies
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: python -m pip install -e '.[dev,deep]'

      - name: Dependency consistency
        run: python -m pip check

      - name: Reproduce JSON schemas
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- schemas

      - name: Compile
        run: make compile

      - name: Ruff lint
        run: make lint

      - name: Ruff format
        run: make format-check

      - name: Strict mypy
        run: make type

      - name: Bandit
        run: make security

      - name: Hermetic tests + branch coverage
        run: |
          mkdir -p quality
          python -m pytest \
            -q -p no:cacheprovider \
            -m 'not live' \
            --hypothesis-profile=fast \
            --cov=xrp_regime_engine --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --junitxml=quality/pytest.xml
          python scripts/check_coverage_policy.py coverage.json --report quality/coverage_policy.json

      - name: Changed-line coverage — 100%
        run: >-
          python scripts/check_changed_line_coverage.py coverage.json
          --base origin/main
          --threshold 100
          --report quality/diff-coverage.json

      - name: Repository and source-manifest contracts
        run: |
          python scripts/build_manifest.py --check
          python scripts/verify_repository.py

      - name: Build wheel
        run: make wheel

      - name: DEEP flake/seed replay
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: python scripts/run_flake_gate.py --runs 3 --output quality/flake_gate.json

      - name: DEEP independent diff-cover cross-check
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: make diff-cover-crosscheck

      - name: DEEP dependency audit
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: make audit

      - name: DEEP SBOM
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: make sbom

      - name: Python 3.12 compatibility
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify Python 3.12
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q -p no:cacheprovider -m 'not live' --hypothesis-profile=deep

      - name: Python 3.13 compatibility
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify Python 3.13
        if: env.CI_PROFILE == 'deep' || env.CI_PROFILE == 'release'
        run: |
          python -m pip install -e '.[dev,deep]'
          python -m pytest -q -p no:cacheprovider -m 'not live' --hypothesis-profile=deep

      - name: RELEASE mutation gauntlet
        if: env.CI_PROFILE == 'release'
        run: make mutation

      - name: RELEASE reproducible package
        if: env.CI_PROFILE == 'release'
        run: |
          make reproducible-wheel
          twine check dist-a/*.whl

      - name: RELEASE clean wheel install
        if: env.CI_PROFILE == 'release'
        run: |
          rm -rf /tmp/xrp-wheel-smoke
          python -m venv /tmp/xrp-wheel-smoke
          /tmp/xrp-wheel-smoke/bin/python -m pip install dist-a/*.whl
          /tmp/xrp-wheel-smoke/bin/python -c 'import xrp_regime_engine; print(xrp_regime_engine.__version__)'
          /tmp/xrp-wheel-smoke/bin/xrp-regime --help >/dev/null

      - name: Emit machine-readable quality evidence
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - CI_STARTED_EPOCH ))
          minutes=$(python -c "print(round(${elapsed}/60, 3))")
          wheel_path=$(find dist dist-a -maxdepth 1 -name '*.whl' -print 2>/dev/null | head -1 || true)
          args=(--runner-minutes "$minutes" --python-versions "3.11")
          if [[ "$CI_PROFILE" == "deep" || "$CI_PROFILE" == "release" ]]; then
            args=(--runner-minutes "$minutes" --python-versions "3.11,3.12,3.13")
          fi
          if [[ -n "$wheel_path" ]]; then args+=(--wheel "$wheel_path"); fi
          python scripts/quality_evidence.py "${args[@]}"
          cat quality/QUALITY_EVIDENCE.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce runner-time budget
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - CI_STARTED_EPOCH ))
          case "$CI_PROFILE" in
            fast) budget=480 ;;
            deep) budget=1500 ;;
            release) budget=1800 ;;
            *) echo "unknown profile: $CI_PROFILE"; exit 1 ;;
          esac
          echo "profile=$CI_PROFILE elapsed_seconds=$elapsed budget_seconds=$budget"
          test "$elapsed" -le "$budget"
