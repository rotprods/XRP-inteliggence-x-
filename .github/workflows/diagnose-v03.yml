name: diagnose-v03

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: diagnose-v03
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Execute diagnostics without hiding failures
        id: diagnostics
        shell: bash
        run: |
          mkdir -p reports/ci-diagnostics
          set +e

          python -m pip install --upgrade pip > reports/ci-diagnostics/pip-upgrade.log 2>&1
          if python -m pip install -e '.[dev]' > reports/ci-diagnostics/install.log 2>&1; then
            install=0
          else
            python -m pip install -e . >> reports/ci-diagnostics/install.log 2>&1
            python -m pip install pytest pytest-cov ruff mypy bandit >> reports/ci-diagnostics/install.log 2>&1
            install=$?
          fi

          python -m compileall -q src tests scripts > reports/ci-diagnostics/compile.log 2>&1
          compile=$?
          ruff check src tests scripts > reports/ci-diagnostics/ruff.log 2>&1
          ruff=$?
          ruff format --check src tests scripts > reports/ci-diagnostics/format.log 2>&1
          format=$?
          python -m pytest -q > reports/ci-diagnostics/pytest.log 2>&1
          pytest=$?
          bandit -q -r src/xrp_regime_engine > reports/ci-diagnostics/bandit.log 2>&1
          bandit=$?
          if [[ -f scripts/verify_read_only_boundary.py ]]; then
            python scripts/verify_read_only_boundary.py > reports/ci-diagnostics/read-only-boundary.log 2>&1
            boundary=$?
          else
            echo "boundary script not yet present" > reports/ci-diagnostics/read-only-boundary.log
            boundary=2
          fi

          python - <<PY
          import json
          from pathlib import Path
          status = {
              "install": $install,
              "compile": $compile,
              "ruff": $ruff,
              "format": $format,
              "pytest": $pytest,
              "bandit": $bandit,
              "read_only_boundary": $boundary,
              "all_required_pass": all(code == 0 for code in [$install, $compile, $ruff, $format, $pytest, $bandit, $boundary]),
          }
          Path("reports/ci-diagnostics/STATUS.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "compile=$compile" >> "$GITHUB_OUTPUT"
          echo "ruff=$ruff" >> "$GITHUB_OUTPUT"
          echo "format=$format" >> "$GITHUB_OUTPUT"
          echo "pytest=$pytest" >> "$GITHUB_OUTPUT"
          echo "bandit=$bandit" >> "$GITHUB_OUTPUT"
          echo "boundary=$boundary" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist changed diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ci-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "test(ci): persist deterministic repository diagnostics"
            git push origin HEAD:feat/xrp-engine-foundation-v0.3
          fi

      - name: Report summary on PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 1 --repo rotprods/XRP-inteliggence-x- --body "Diagnostic gate: install=${{ steps.diagnostics.outputs.install }}, compile=${{ steps.diagnostics.outputs.compile }}, ruff=${{ steps.diagnostics.outputs.ruff }}, format=${{ steps.diagnostics.outputs.format }}, pytest=${{ steps.diagnostics.outputs.pytest }}, bandit=${{ steps.diagnostics.outputs.bandit }}, read-only-boundary=${{ steps.diagnostics.outputs.boundary }}. Detailed deterministic logs are in reports/ci-diagnostics/." 2>/dev/null || true
