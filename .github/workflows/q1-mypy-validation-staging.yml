name: Q1 Strict Mypy Validation Staging

on:
  push:
    branches:
      - fix/q1-mypy-strict-20260921

permissions:
  contents: read

concurrency:
  group: q1-mypy-validation-staging
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[mypy-validation-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile
        run: make compile
      - name: Ruff lint
        run: make lint
      - name: Ruff format
        run: make format-check
      - name: Strict mypy
        run: make type
      - name: Bandit
        run: make security
      - name: Hermetic fast tests
        run: make test-fast
      - name: Patch integrity
        run: git diff --check
