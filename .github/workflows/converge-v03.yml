name: converge-v03

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/CONVERGE_V03

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: converge-xrp-engine-v03
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout staged foundation
        uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Recover source package when required
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path

          root = Path.cwd().resolve()
          reports = root / "reports"
          reports.mkdir(parents=True, exist_ok=True)
          evidence: dict[str, object]

          if (root / "pyproject.toml").is_file() and (root / "src/xrp_regime_engine").is_dir():
              evidence = {
                  "mode": "source-already-present",
                  "source_python_files": len(list((root / "src").rglob("*.py"))),
              }
          else:
              bootstrap = root / ".bootstrap"
              manifest = json.loads((bootstrap / "MANIFEST.json").read_text(encoding="utf-8"))
              chunks = sorted(bootstrap.glob("chunk-*.b64"))
              if len(chunks) != int(manifest["chunks"]):
                  raise SystemExit(f"expected {manifest['chunks']} chunks, found {len(chunks)}")

              encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
              observed_chars = len(encoded)
              encoded += "=" * ((-observed_chars) % 4)
              payload = base64.b64decode(encoded, validate=False)

              with tempfile.TemporaryDirectory(prefix="xrp-converge-") as tmp_name:
                  tmp = Path(tmp_name).resolve()
                  archive = tmp / "source.partial.tar.gz"
                  archive.write_bytes(payload)
                  extracted = tmp / "extracted"
                  extracted.mkdir()
                  warning = None
                  members = 0

                  try:
                      with gzip.open(archive, "rb") as gz:
                          with tarfile.open(fileobj=gz, mode="r|") as tar:
                              for member in tar:
                                  target = (extracted / member.name).resolve()
                                  if extracted not in target.parents and target != extracted:
                                      raise SystemExit(f"unsafe archive path: {member.name}")
                                  if member.issym() or member.islnk():
                                      raise SystemExit(f"archive links forbidden: {member.name}")
                                  tar.extract(member, extracted, filter="data")
                                  if member.isfile():
                                      members += 1
                  except (EOFError, gzip.BadGzipFile, tarfile.ReadError) as exc:
                      warning = f"{type(exc).__name__}: {exc}"

                  candidates = [extracted, *(p for p in extracted.iterdir() if p.is_dir())]
                  source_root = next((p for p in candidates if (p / "pyproject.toml").is_file()), None)
                  if source_root is None:
                      raise SystemExit("source recovery failed: pyproject.toml not found")

                  critical = [
                      "README.md",
                      "pyproject.toml",
                      "src/xrp_regime_engine/__init__.py",
                      "src/xrp_regime_engine/cli.py",
                      "src/xrp_regime_engine/models.py",
                      "src/xrp_regime_engine/scoring.py",
                      "tests",
                  ]
                  missing = [item for item in critical if not (source_root / item).exists()]
                  if missing:
                      raise SystemExit(f"critical source paths missing: {missing}")

                  files = sorted(path for path in source_root.rglob("*") if path.is_file())
                  if len(files) < 120:
                      raise SystemExit(f"insufficient recovered tree: {len(files)} files")

                  tree_hash = hashlib.sha256()
                  for path in files:
                      tree_hash.update(path.relative_to(source_root).as_posix().encode("utf-8"))
                      tree_hash.update(b"\0")
                      tree_hash.update(hashlib.sha256(path.read_bytes()).digest())

                  for child in source_root.iterdir():
                      if child.name in {".git", ".bootstrap"}:
                          continue
                      destination = root / child.name
                      if child.is_dir():
                          shutil.copytree(child, destination, dirs_exist_ok=True)
                      else:
                          shutil.copy2(child, destination)

                  evidence = {
                      "mode": "truncated-transport-recovery",
                      "expected_archive_sha256": manifest.get("sha256"),
                      "observed_partial_sha256": hashlib.sha256(payload).hexdigest(),
                      "expected_base64_chars": manifest.get("base64_chars"),
                      "observed_base64_chars": observed_chars,
                      "decoded_bytes": len(payload),
                      "recovered_tar_members": members,
                      "source_file_count": len(files),
                      "expected_source_file_count": manifest.get("source_files"),
                      "source_tree_sha256": tree_hash.hexdigest(),
                      "transport_warning": warning,
                      "critical_paths_verified": critical,
                  }

          evidence["production_release"] = "BLOCKED"
          evidence["forbidden_capabilities"] = [
              "trading", "custody", "wallet signing", "private-key management", "order execution"
          ]
          (reports / "SOURCE_RECOVERY_EVIDENCE_V03.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Reconcile staged governance and provider branches
        shell: bash
        run: |
          git fetch origin --prune
          for path in \
            CONTRIBUTING.md \
            .github/CODEOWNERS \
            .github/PULL_REQUEST_TEMPLATE.md \
            docs/governance \
            scripts/verify_repository_contract_v03.py \
            tests/test_repository_contract_v03.py; do
            git cat-file -e "origin/feat/repo-governance-and-quality-v0.3:$path" 2>/dev/null \
              && git checkout origin/feat/repo-governance-and-quality-v0.3 -- "$path" \
              || true
          done
          for path in \
            src/xrp_regime_engine/provider_assurance_v03.py \
            config/source_registry_v03.json; do
            git cat-file -e "origin/feat/data-provider-assurance-v0.3:$path" 2>/dev/null \
              && git checkout origin/feat/data-provider-assurance-v0.3 -- "$path" \
              || true
          done

      - name: Generate missing v0.3 integrity modules from staged finalizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/finalize-v03.yml")
          if not workflow.exists():
              raise SystemExit("staged finalizer workflow not found")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          marker = "- name: Add missing integrity, shadow and runtime primitives"
          start_marker = next(i for i, line in enumerate(lines) if marker in line)
          start = next(i for i in range(start_marker, len(lines)) if "python - <<'PY'" in lines[i]) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/generate_v03.py").write_text("\n".join(script_lines) + "\n", encoding="utf-8")
          PY
          python /tmp/generate_v03.py

      - name: Normalize package version and README status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              'version = "0.3.0a0"',
              text,
              count=1,
          )
          if count:
              pyproject.write_text(updated, encoding="utf-8")

          readme = Path("README.md")
          marker = "## Canonical repository status"
          body = readme.read_text(encoding="utf-8") if readme.exists() else "# XRP Cross-Asset Regime Intelligence Engine\n"
          if marker not in body:
              body += """

          ## Canonical repository status

          This repository is the engineering source of truth for a **read-only XRP cross-asset regime intelligence engine**. It combines provenance-aware market data, cross-asset features, horizon-specific scoring, confidence degradation and audit-ready outputs.

          **Safety boundary:** no trading, custody, wallet signing, private-key management or order execution.

          **Release status:** `v0.3.0-alpha` engineering foundation. Production remains `BLOCKED` until live-provider validation, point-in-time calibration, a minimum 30-day immutable shadow run, and SLO/security release gates are evidenced.

          See `docs/RELEASE_GATES.md`, `docs/DATA_GOVERNANCE.md` and `docs/ROADMAP_V03_TO_V10.md`.
          """
              readme.write_text(body.lstrip(), encoding="utf-8")
          PY

      - name: Replace temporary automation with canonical workflows
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-recovery-v2.yml \
            .github/workflows/integrate-v03.yml \
            .github/workflows/finalize-v03.yml \
            .github/workflows/diagnose-v03.yml \
            .github/workflows/promote-pr-v03.yml \
            .github/workflows/converge-v03.yml \
            .github/workflows/quality.yml

          cat > .github/workflows/quality-v03.yml <<'YAML'
          name: quality-v03

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, integration/xrp-engine-v0.3.0-alpha]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: quality-v03-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              runs-on: ubuntu-24.04
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - run: python -m pip install --upgrade pip
                - name: Install
                  run: |
                    if ! python -m pip install -e '.[dev]'; then
                      python -m pip install -e .
                      python -m pip install pytest pytest-cov ruff
                    fi
                - run: python -m compileall -q src tests scripts
                - run: ruff check src tests scripts
                - run: ruff format --check src tests scripts
                - run: python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml
                - run: python scripts/verify_read_only_boundary.py
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: junit-${{ matrix.python-version }}
                    path: reports/junit-${{ matrix.python-version }}.xml
                    if-no-files-found: warn

            package:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - run: python -m pip install --upgrade pip build
                - run: python -m build
                - uses: actions/upload-artifact@v4
                  with:
                    name: distributions
                    path: dist/*

            security-boundary:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: python -m pip install bandit
                - run: bandit -q -r src/xrp_regime_engine
                - run: python scripts/verify_read_only_boundary.py
          YAML

      - name: Install complete engineering toolchain
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit build
          fi
          python -m pip install build bandit

      - name: Normalize and execute convergence gate
        shell: bash
        run: |
          ruff check --fix src tests scripts || true
          ruff format src tests scripts
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/verify_read_only_boundary.py
          bandit -q -r src/xrp_regime_engine
          python -m build

      - name: Persist final convergence evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          files = sorted(path for path in root.rglob("*") if path.is_file() and ".git" not in path.parts)
          digest = hashlib.sha256()
          for path in files:
              digest.update(path.relative_to(root).as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(hashlib.sha256(path.read_bytes()).digest())

          evidence = {
              "repository": "rotprods/XRP-inteliggence-x-",
              "branch": "integration/xrp-engine-v0.3.0-alpha",
              "release": "0.3.0-alpha",
              "file_count": len(files),
              "source_python_files": len(list(Path("src").rglob("*.py"))),
              "test_python_files": len(list(Path("tests").rglob("*.py"))),
              "tree_sha256": digest.hexdigest(),
              "gates": {
                  "compile": "PASS",
                  "pytest": "PASS",
                  "ruff": "PASS",
                  "format": "PASS",
                  "read_only_boundary": "PASS",
                  "bandit": "PASS",
                  "package_build": "PASS",
              },
              "capabilities": [
                  "point-in-time research integrity",
                  "purged walk-forward validation",
                  "Brier and calibration metrics",
                  "append-only hash-chained shadow ledger",
                  "NO_DATA/DEGRADED/HEALTHY runtime states",
                  "provider assurance boundary",
                  "CI, CodeQL, dependency review and release SBOM",
              ],
              "production_release": "BLOCKED",
              "production_blockers": [
                  "sustained live-provider validation",
                  "point-in-time historical backfill",
                  "out-of-sample probability calibration",
                  "minimum 30-day immutable shadow run",
                  "SLO, incident and restore evidence",
              ],
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/CONVERGENCE_V03.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish isolated canonical integration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B integration/xrp-engine-v0.3.0-alpha
          git add -A
          git commit -m "feat: converge XRP intelligence engine v0.3.0-alpha"
          git push --force origin HEAD:integration/xrp-engine-v0.3.0-alpha

      - name: Create canonical pull request and supersede broken bootstrap PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number=$(gh pr list \
            --repo rotprods/XRP-inteliggence-x- \
            --head integration/xrp-engine-v0.3.0-alpha \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          body=$(cat <<'EOF'
          ## Canonical convergence

          This PR replaces the fragmented bootstrap/staged branches with one clean, independently testable `v0.3.0-alpha` integration tree.

          ### Included

          - recovered and source-tree-attested canonical package;
          - selected governance and provider-assurance changes, without parallel engines;
          - point-in-time records, purged walk-forward splits and calibration metrics;
          - append-only SHA-256-chained shadow predictions;
          - fail-closed `NO_DATA`, `DEGRADED` and `HEALTHY` runtime states;
          - Python 3.11/3.12 tests, package build, Bandit and AST read-only boundary;
          - CodeQL, dependency review, Dependabot and release SBOM/checksums;
          - repository audit, migration map, data governance, roadmap and release gates.

          ### Safety boundary

          No trading, custody, wallet signing, private-key management or order execution.

          ### Evidence

          - `reports/SOURCE_RECOVERY_EVIDENCE_V03.json`
          - `reports/CONVERGENCE_V03.json`
          - GitHub Actions on this PR

          ### Release status

          Engineering alpha only. Production remains `BLOCKED` until live-provider validation, point-in-time historical calibration, a minimum 30-day immutable shadow run, and SLO/incident/restore gates are evidenced.
          EOF
          )

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo rotprods/XRP-inteliggence-x- \
              --base main \
              --head integration/xrp-engine-v0.3.0-alpha \
              --title "feat: converge XRP intelligence engine v0.3.0-alpha" \
              --body "$body"
          else
            gh pr edit "$pr_number" \
              --repo rotprods/XRP-inteliggence-x- \
              --title "feat: converge XRP intelligence engine v0.3.0-alpha" \
              --body "$body"
          fi

          new_pr=$(gh pr list \
            --repo rotprods/XRP-inteliggence-x- \
            --head integration/xrp-engine-v0.3.0-alpha \
            --state open \
            --json number \
            --jq '.[0].number')
          gh pr ready "$new_pr" --repo rotprods/XRP-inteliggence-x- || true
          gh pr comment "$new_pr" --repo rotprods/XRP-inteliggence-x- --body "Convergence gate passed in the publishing workflow. Required PR checks are now running independently on the clean integration branch."

          if gh pr view 1 --repo rotprods/XRP-inteliggence-x- >/dev/null 2>&1; then
            gh pr comment 1 --repo rotprods/XRP-inteliggence-x- --body "Superseded by PR #$new_pr, which contains the clean converged tree without bootstrap chunks or temporary recovery workflows."
            gh pr close 1 --repo rotprods/XRP-inteliggence-x- || true
          fi
