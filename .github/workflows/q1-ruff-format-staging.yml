name: Q1 Ruff Format Staging

on:
  push:
    branches:
      - chore/q1-ruff-format-staging

permissions:
  contents: write

concurrency:
  group: q1-ruff-format-staging
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-format-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.16.8'
      - name: Apply canonical formatting
        run: python -m ruff format src tests scripts
      - name: Verify formatter fixed point
        run: python -m ruff format --check src tests scripts
      - name: Verify patch integrity
        run: git diff --check
      - name: Commit formatting-only remediation
        shell: bash
        run: |
          if git diff --quiet -- src tests scripts; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git diff --cached --stat
          git diff --cached --check
          git commit -m 'style(q1): complete Ruff 0.16.8 format remediation [ruff-format-bot]'
          git push origin HEAD:chore/q1-ruff-format-staging
