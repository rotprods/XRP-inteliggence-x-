name: converge-v04

on:
  push:
    branches: [feat/xrp-engine-foundation-v0.3]
    paths:
      - .bootstrap/CONVERGE_V04

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: converge-xrp-engine-v04
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrp-engine-foundation-v0.3
          fetch-depth: 0

      - name: Recover source safely when absent
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path

          root = Path.cwd().resolve()
          reports = root / "reports"
          reports.mkdir(parents=True, exist_ok=True)

          if (root / "pyproject.toml").is_file() and (root / "src/xrp_regime_engine").is_dir():
              evidence = {"mode": "source-already-present"}
          else:
              bootstrap = root / ".bootstrap"
              manifest = json.loads((bootstrap / "MANIFEST.json").read_text(encoding="utf-8"))
              chunks = sorted(bootstrap.glob("chunk-*.b64"))
              if len(chunks) != int(manifest["chunks"]):
                  raise SystemExit(f"chunk mismatch: {len(chunks)}")
              encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
              observed_chars = len(encoded)
              encoded += "=" * ((-observed_chars) % 4)
              payload = base64.b64decode(encoded, validate=False)

              with tempfile.TemporaryDirectory(prefix="xrp-v04-") as tmp_name:
                  tmp = Path(tmp_name).resolve()
                  archive = tmp / "source.partial.tar.gz"
                  archive.write_bytes(payload)
                  extracted = tmp / "extracted"
                  extracted.mkdir()
                  warning = None
                  members = 0
                  try:
                      with gzip.open(archive, "rb") as gz:
                          with tarfile.open(fileobj=gz, mode="r|") as tar:
                              for member in tar:
                                  target = (extracted / member.name).resolve()
                                  if extracted not in target.parents and target != extracted:
                                      raise SystemExit(f"unsafe path: {member.name}")
                                  if member.issym() or member.islnk():
                                      raise SystemExit(f"archive links forbidden: {member.name}")
                                  tar.extract(member, extracted, filter="data")
                                  members += int(member.isfile())
                  except (EOFError, gzip.BadGzipFile, tarfile.ReadError) as exc:
                      warning = f"{type(exc).__name__}: {exc}"

                  roots = [extracted, *(item for item in extracted.iterdir() if item.is_dir())]
                  source_root = next((item for item in roots if (item / "pyproject.toml").is_file()), None)
                  if source_root is None:
                      raise SystemExit("pyproject.toml not recovered")
                  critical = [
                      "README.md",
                      "pyproject.toml",
                      "src/xrp_regime_engine/__init__.py",
                      "src/xrp_regime_engine/cli.py",
                      "src/xrp_regime_engine/models.py",
                      "src/xrp_regime_engine/scoring.py",
                      "tests",
                  ]
                  missing = [item for item in critical if not (source_root / item).exists()]
                  if missing:
                      raise SystemExit(f"critical paths missing: {missing}")
                  files = sorted(item for item in source_root.rglob("*") if item.is_file())
                  if len(files) < 120:
                      raise SystemExit(f"recovered tree too small: {len(files)}")
                  tree_hash = hashlib.sha256()
                  for path in files:
                      tree_hash.update(path.relative_to(source_root).as_posix().encode())
                      tree_hash.update(b"\0")
                      tree_hash.update(hashlib.sha256(path.read_bytes()).digest())
                  for child in source_root.iterdir():
                      if child.name in {".git", ".bootstrap"}:
                          continue
                      destination = root / child.name
                      if child.is_dir():
                          shutil.copytree(child, destination, dirs_exist_ok=True)
                      else:
                          shutil.copy2(child, destination)
                  evidence = {
                      "mode": "attested-truncated-transport-recovery",
                      "expected_archive_sha256": manifest.get("sha256"),
                      "observed_partial_sha256": hashlib.sha256(payload).hexdigest(),
                      "expected_base64_chars": manifest.get("base64_chars"),
                      "observed_base64_chars": observed_chars,
                      "recovered_members": members,
                      "source_file_count": len(files),
                      "source_tree_sha256": tree_hash.hexdigest(),
                      "transport_warning": warning,
                      "critical_paths_verified": critical,
                  }

          evidence.update(
              {
                  "production_release": "BLOCKED",
                  "mode_contract": "read-only-market-intelligence",
              }
          )
          (reports / "SOURCE_RECOVERY_EVIDENCE_V04.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Overlay selected staged assets
        shell: bash
        run: |
          git fetch origin --prune
          for path in \
            CONTRIBUTING.md \
            .github/CODEOWNERS \
            .github/PULL_REQUEST_TEMPLATE.md \
            docs/governance \
            scripts/verify_repository_contract_v03.py \
            tests/test_repository_contract_v03.py; do
            git cat-file -e "origin/feat/repo-governance-and-quality-v0.3:$path" 2>/dev/null \
              && git checkout origin/feat/repo-governance-and-quality-v0.3 -- "$path" \
              || true
          done
          for path in \
            src/xrp_regime_engine/provider_assurance_v03.py \
            config/source_registry_v03.json; do
            git cat-file -e "origin/feat/data-provider-assurance-v0.3:$path" 2>/dev/null \
              && git checkout origin/feat/data-provider-assurance-v0.3 -- "$path" \
              || true
          done

      - name: Add point-in-time research integrity
        shell: bash
        run: |
          cat > src/xrp_regime_engine/research_integrity.py <<'PY'
          """Point-in-time research primitives with explicit anti-leakage semantics."""

          from __future__ import annotations

          import json
          import math
          from dataclasses import dataclass
          from datetime import datetime, timezone
          from hashlib import sha256
          from typing import Any, Iterable, Iterator, Sequence


          def _utc(value: datetime) -> datetime:
              if value.tzinfo is None:
                  raise ValueError("timestamp must be timezone-aware")
              return value.astimezone(timezone.utc)


          @dataclass(frozen=True, slots=True)
          class PointInTimeRecord:
              provider: str
              key: str
              event_at: datetime
              observed_at: datetime
              available_at: datetime
              revision: int
              value: float
              raw_sha256: str

              def __post_init__(self) -> None:
                  object.__setattr__(self, "event_at", _utc(self.event_at))
                  object.__setattr__(self, "observed_at", _utc(self.observed_at))
                  object.__setattr__(self, "available_at", _utc(self.available_at))
                  if self.revision < 0:
                      raise ValueError("revision must be non-negative")
                  if not math.isfinite(self.value):
                      raise ValueError("value must be finite")
                  if len(self.raw_sha256) != 64:
                      raise ValueError("raw_sha256 must be a SHA-256 digest")

              def is_available(self, decision_at: datetime) -> bool:
                  return self.available_at <= _utc(decision_at)


          def payload_sha256(payload: Any) -> str:
              encoded = json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
                  default=str,
              ).encode("utf-8")
              return sha256(encoded).hexdigest()


          def resolve_as_of(
              records: Iterable[PointInTimeRecord],
              *,
              decision_at: datetime,
          ) -> dict[str, PointInTimeRecord]:
              cutoff = _utc(decision_at)
              resolved: dict[str, PointInTimeRecord] = {}
              for record in records:
                  if record.available_at > cutoff:
                      continue
                  current = resolved.get(record.key)
                  rank = (record.event_at, record.available_at, record.revision)
                  if current is None or rank > (
                      current.event_at,
                      current.available_at,
                      current.revision,
                  ):
                      resolved[record.key] = record
              return resolved


          @dataclass(frozen=True, slots=True)
          class WalkForwardSplit:
              train: range
              embargo: range
              test: range


          def purged_walk_forward(
              length: int,
              *,
              minimum_train: int,
              test_size: int,
              step: int | None = None,
              embargo: int = 0,
          ) -> Iterator[WalkForwardSplit]:
              if min(length, minimum_train, test_size) <= 0:
                  raise ValueError("length, minimum_train and test_size must be positive")
              if embargo < 0:
                  raise ValueError("embargo cannot be negative")
              stride = test_size if step is None else step
              if stride <= 0:
                  raise ValueError("step must be positive")
              test_start = minimum_train + embargo
              while test_start + test_size <= length:
                  train_stop = test_start - embargo
                  yield WalkForwardSplit(
                      train=range(0, train_stop),
                      embargo=range(train_stop, test_start),
                      test=range(test_start, test_start + test_size),
                  )
                  test_start += stride


          def brier_score(probabilities: Sequence[float], outcomes: Sequence[int]) -> float:
              if len(probabilities) != len(outcomes) or not probabilities:
                  raise ValueError("equal non-empty sequences required")
              total = 0.0
              for probability, outcome in zip(probabilities, outcomes, strict=True):
                  if not 0.0 <= probability <= 1.0 or outcome not in (0, 1):
                      raise ValueError("invalid probability or binary outcome")
                  total += (probability - outcome) ** 2
              return total / len(probabilities)


          def expected_calibration_error(
              probabilities: Sequence[float],
              outcomes: Sequence[int],
              *,
              bins: int = 10,
          ) -> float:
              if bins <= 0:
                  raise ValueError("bins must be positive")
              if len(probabilities) != len(outcomes) or not probabilities:
                  raise ValueError("equal non-empty sequences required")
              groups: list[list[tuple[float, int]]] = [[] for _ in range(bins)]
              for probability, outcome in zip(probabilities, outcomes, strict=True):
                  if not 0.0 <= probability <= 1.0 or outcome not in (0, 1):
                      raise ValueError("invalid probability or binary outcome")
                  groups[min(int(probability * bins), bins - 1)].append((probability, outcome))
              total = len(probabilities)
              error = 0.0
              for group in groups:
                  if not group:
                      continue
                  confidence = sum(item[0] for item in group) / len(group)
                  accuracy = sum(item[1] for item in group) / len(group)
                  error += len(group) / total * abs(confidence - accuracy)
              return error
          PY

      - name: Add immutable shadow ledger
        shell: bash
        run: |
          cat > src/xrp_regime_engine/shadow_ledger.py <<'PY'
          """Append-only, SHA-256-chained shadow predictions."""

          from __future__ import annotations

          import json
          import os
          import uuid
          from dataclasses import asdict, dataclass, field
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          from typing import Any, Iterable


          def _utc_iso(value: datetime) -> str:
              if value.tzinfo is None:
                  raise ValueError("timestamp must be timezone-aware")
              return value.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")


          def _canonical(payload: dict[str, Any]) -> bytes:
              return json.dumps(
                  payload,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")


          @dataclass(frozen=True, slots=True)
          class ShadowPrediction:
              prediction_id: str
              created_at: str
              asset: str
              horizon: str
              regime: str
              probabilities: dict[str, float]
              confidence: float
              drivers: tuple[str, ...] = ()
              invalidations: tuple[str, ...] = ()
              source_health: dict[str, str] = field(default_factory=dict)
              model_version: str = "unknown"
              previous_hash: str | None = None
              record_hash: str | None = None

              @classmethod
              def create(
                  cls,
                  *,
                  created_at: datetime,
                  asset: str,
                  horizon: str,
                  regime: str,
                  probabilities: dict[str, float],
                  confidence: float,
                  model_version: str,
                  previous_hash: str | None,
                  drivers: Iterable[str] = (),
                  invalidations: Iterable[str] = (),
                  source_health: dict[str, str] | None = None,
                  prediction_id: str | None = None,
              ) -> "ShadowPrediction":
                  if not 0.0 <= confidence <= 1.0:
                      raise ValueError("confidence outside [0, 1]")
                  if not probabilities or any(
                      not 0.0 <= value <= 1.0 for value in probabilities.values()
                  ):
                      raise ValueError("invalid probability map")
                  draft = cls(
                      prediction_id=prediction_id or str(uuid.uuid4()),
                      created_at=_utc_iso(created_at),
                      asset=asset.upper(),
                      horizon=horizon,
                      regime=regime,
                      probabilities=dict(sorted(probabilities.items())),
                      confidence=confidence,
                      drivers=tuple(drivers),
                      invalidations=tuple(invalidations),
                      source_health=dict(sorted((source_health or {}).items())),
                      model_version=model_version,
                      previous_hash=previous_hash,
                  )
                  payload = asdict(draft)
                  payload.pop("record_hash")
                  digest = sha256(_canonical(payload)).hexdigest()
                  return cls(**{**payload, "record_hash": digest})


          class AppendOnlyShadowLedger:
              def __init__(self, path: str | Path) -> None:
                  self.path = Path(path)
                  self.path.parent.mkdir(parents=True, exist_ok=True)

              def records(self) -> list[dict[str, Any]]:
                  if not self.path.exists():
                      return []
                  return [
                      json.loads(line)
                      for line in self.path.read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]

              def head_hash(self) -> str | None:
                  rows = self.records()
                  return rows[-1]["record_hash"] if rows else None

              def append(self, prediction: ShadowPrediction) -> None:
                  rows = self.records()
                  if any(row["prediction_id"] == prediction.prediction_id for row in rows):
                      raise ValueError("prediction_id already exists")
                  if prediction.previous_hash != self.head_hash():
                      raise ValueError("previous_hash does not match ledger head")
                  payload = asdict(prediction)
                  expected = payload.pop("record_hash")
                  if sha256(_canonical(payload)).hexdigest() != expected:
                      raise ValueError("record_hash is invalid")
                  line = json.dumps(asdict(prediction), sort_keys=True, separators=(",", ":")) + "\n"
                  descriptor = os.open(
                      self.path,
                      os.O_WRONLY | os.O_CREAT | os.O_APPEND,
                      0o600,
                  )
                  try:
                      os.write(descriptor, line.encode("utf-8"))
                      os.fsync(descriptor)
                  finally:
                      os.close(descriptor)

              def verify(self) -> bool:
                  previous: str | None = None
                  seen: set[str] = set()
                  for original in self.records():
                      row = dict(original)
                      record_hash = row.pop("record_hash")
                      if row["prediction_id"] in seen or row["previous_hash"] != previous:
                          return False
                      if sha256(_canonical(row)).hexdigest() != record_hash:
                          return False
                      seen.add(row["prediction_id"])
                      previous = record_hash
                  return True
          PY

      - name: Add fail-closed runtime data state
        shell: bash
        run: |
          cat > src/xrp_regime_engine/runtime_status.py <<'PY'
          """Fail-closed runtime data-state classification."""

          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime, timedelta, timezone
          from enum import StrEnum
          from typing import Iterable


          class DataState(StrEnum):
              NO_DATA = "NO_DATA"
              DEGRADED = "DEGRADED"
              HEALTHY = "HEALTHY"


          @dataclass(frozen=True, slots=True)
          class ProviderState:
              provider: str
              observed_at: datetime
              valid: bool
              independent_group: str

              def age(self, now: datetime) -> timedelta:
                  if self.observed_at.tzinfo is None or now.tzinfo is None:
                      raise ValueError("timestamps must be timezone-aware")
                  return now.astimezone(timezone.utc) - self.observed_at.astimezone(timezone.utc)


          @dataclass(frozen=True, slots=True)
          class RuntimeStatus:
              state: DataState
              confidence_ceiling: float
              usable_sources: int
              independent_groups: int
              reasons: tuple[str, ...]


          def derive_runtime_status(
              providers: Iterable[ProviderState],
              *,
              now: datetime,
              maximum_age: timedelta,
              minimum_sources: int = 2,
              minimum_independent_groups: int = 2,
              agreement: float | None = None,
              minimum_agreement: float = 0.97,
          ) -> RuntimeStatus:
              rows = list(providers)
              usable = [row for row in rows if row.valid and row.age(now) <= maximum_age]
              groups = {row.independent_group for row in usable}
              if not usable:
                  return RuntimeStatus(DataState.NO_DATA, 0.0, 0, 0, ("no fresh valid source",))
              reasons: list[str] = []
              if len(usable) < minimum_sources:
                  reasons.append("insufficient fresh sources")
              if len(groups) < minimum_independent_groups:
                  reasons.append("insufficient independent source groups")
              if agreement is None:
                  reasons.append("source agreement unavailable")
              elif agreement < minimum_agreement:
                  reasons.append("source disagreement exceeds threshold")
              if reasons:
                  return RuntimeStatus(
                      DataState.DEGRADED,
                      0.49,
                      len(usable),
                      len(groups),
                      tuple(reasons),
                  )
              return RuntimeStatus(DataState.HEALTHY, 1.0, len(usable), len(groups), ())
          PY

      - name: Add AST read-only boundary and deterministic tests
        shell: bash
        run: |
          mkdir -p scripts tests
          cat > scripts/verify_read_only_boundary.py <<'PY'
          """Exit non-zero when financial-execution primitives appear in source code."""

          from __future__ import annotations

          import ast
          from pathlib import Path

          FORBIDDEN_NAMES = {
              "execute_trade",
              "place_order",
              "send_transaction",
              "sign_transaction",
              "submit_order",
              "withdraw_funds",
          }


          def dotted_name(node: ast.AST) -> str | None:
              if isinstance(node, ast.Name):
                  return node.id
              if isinstance(node, ast.Attribute):
                  prefix = dotted_name(node.value)
                  return f"{prefix}.{node.attr}" if prefix else node.attr
              return None


          def scan(root: Path) -> list[str]:
              violations: list[str] = []
              for path in root.rglob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          if node.name in FORBIDDEN_NAMES:
                              violations.append(f"{path}:{node.lineno}:definition:{node.name}")
                      elif isinstance(node, ast.Call):
                          name = dotted_name(node.func)
                          terminal = name.rsplit(".", 1)[-1] if name else None
                          if terminal in FORBIDDEN_NAMES:
                              violations.append(f"{path}:{node.lineno}:call:{name}")
              return violations


          if __name__ == "__main__":
              found = scan(Path("src"))
              if found:
                  raise SystemExit("Forbidden execution primitives:\n" + "\n".join(found))
              print("read-only boundary: PASS")
          PY

          cat > tests/test_research_integrity_v03.py <<'PY'
          from datetime import datetime, timezone

          import pytest

          from xrp_regime_engine.research_integrity import (
              PointInTimeRecord,
              brier_score,
              expected_calibration_error,
              purged_walk_forward,
              resolve_as_of,
          )


          def timestamp(day: int) -> datetime:
              return datetime(2026, 1, day, tzinfo=timezone.utc)


          def record(*, available: int, revision: int, value: float) -> PointInTimeRecord:
              return PointInTimeRecord(
                  provider="test",
                  key="XRP/USD",
                  event_at=timestamp(1),
                  observed_at=timestamp(available),
                  available_at=timestamp(available),
                  revision=revision,
                  value=value,
                  raw_sha256="a" * 64,
              )


          def test_future_revision_is_not_visible() -> None:
              result = resolve_as_of(
                  [record(available=2, revision=0, value=1.0), record(available=4, revision=1, value=9.0)],
                  decision_at=timestamp(3),
              )
              assert result["XRP/USD"].value == 1.0


          def test_walk_forward_embargo() -> None:
              split = next(purged_walk_forward(30, minimum_train=10, test_size=5, embargo=2))
              assert split.train.stop == 10
              assert list(split.embargo) == [10, 11]
              assert split.test.start == 12


          def test_probability_metrics() -> None:
              assert brier_score([0.0, 1.0], [0, 1]) == 0.0
              assert expected_calibration_error([0.1, 0.9], [0, 1], bins=2) == pytest.approx(0.1)
          PY

          cat > tests/test_shadow_ledger_v03.py <<'PY'
          import json
          from datetime import datetime, timezone

          from xrp_regime_engine.shadow_ledger import AppendOnlyShadowLedger, ShadowPrediction


          def prediction(previous_hash: str | None = None, prediction_id: str = "p1") -> ShadowPrediction:
              return ShadowPrediction.create(
                  created_at=datetime(2026, 1, 1, tzinfo=timezone.utc),
                  asset="XRP",
                  horizon="4h",
                  regime="EARLY_BULLISH_REVERSAL",
                  probabilities={"down": 0.4, "up": 0.6},
                  confidence=0.55,
                  model_version="test",
                  previous_hash=previous_hash,
                  prediction_id=prediction_id,
              )


          def test_append_and_verify(tmp_path) -> None:
              ledger = AppendOnlyShadowLedger(tmp_path / "shadow.jsonl")
              first = prediction()
              ledger.append(first)
              ledger.append(prediction(first.record_hash, "p2"))
              assert ledger.verify()


          def test_tampering_is_detected(tmp_path) -> None:
              ledger = AppendOnlyShadowLedger(tmp_path / "shadow.jsonl")
              ledger.append(prediction())
              row = json.loads(ledger.path.read_text(encoding="utf-8"))
              row["confidence"] = 0.99
              ledger.path.write_text(json.dumps(row) + "\n", encoding="utf-8")
              assert not ledger.verify()
          PY

          cat > tests/test_runtime_status_v03.py <<'PY'
          from datetime import datetime, timedelta, timezone

          from xrp_regime_engine.runtime_status import DataState, ProviderState, derive_runtime_status


          NOW = datetime(2026, 1, 1, 12, tzinfo=timezone.utc)


          def provider(name: str, group: str, minutes: int = 1) -> ProviderState:
              return ProviderState(name, NOW - timedelta(minutes=minutes), True, group)


          def test_no_data_fails_closed() -> None:
              status = derive_runtime_status([], now=NOW, maximum_age=timedelta(minutes=5))
              assert status.state is DataState.NO_DATA
              assert status.confidence_ceiling == 0.0


          def test_independent_consensus_is_healthy() -> None:
              status = derive_runtime_status(
                  [provider("a", "exchange-a"), provider("b", "exchange-b")],
                  now=NOW,
                  maximum_age=timedelta(minutes=5),
                  agreement=0.99,
              )
              assert status.state is DataState.HEALTHY


          def test_disagreement_degrades_confidence() -> None:
              status = derive_runtime_status(
                  [provider("a", "exchange-a"), provider("b", "exchange-b")],
                  now=NOW,
                  maximum_age=timedelta(minutes=5),
                  agreement=0.80,
              )
              assert status.state is DataState.DEGRADED
              assert status.confidence_ceiling < 0.5
          PY

      - name: Normalize version and README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text, _ = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              'version = "0.3.0a0"',
              text,
              count=1,
          )
          pyproject.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          body = readme.read_text(encoding="utf-8") if readme.exists() else "# XRP Regime Engine\n"
          if "## Canonical repository status" not in body:
              body += """

          ## Canonical repository status

          This repository is the engineering source of truth for a **read-only XRP cross-asset regime intelligence engine**. It combines provenance-aware data, cross-asset features, horizon-specific regime scoring, confidence degradation and audit-ready outputs.

          **Safety boundary:** no trading, custody, wallet signing, private-key management or order execution.

          **Release status:** `v0.3.0-alpha` engineering foundation. Production remains `BLOCKED` pending live-provider validation, point-in-time calibration, a minimum 30-day immutable shadow run, and SLO/security evidence.
          """
          readme.write_text(body.lstrip(), encoding="utf-8")
          PY

      - name: Clean bootstrap and install canonical CI
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f \
            .github/workflows/bootstrap-import.yml \
            .github/workflows/bootstrap-recovery-v2.yml \
            .github/workflows/integrate-v03.yml \
            .github/workflows/finalize-v03.yml \
            .github/workflows/diagnose-v03.yml \
            .github/workflows/promote-pr-v03.yml \
            .github/workflows/converge-v03.yml \
            .github/workflows/converge-v04.yml \
            .github/workflows/quality.yml

          cat > .github/workflows/quality-v03.yml <<'YAML'
          name: quality-v03

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, integration/xrp-engine-v0.3.0-alpha]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: quality-v03-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              runs-on: ubuntu-24.04
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - run: python -m pip install --upgrade pip
                - name: Install
                  run: |
                    if ! python -m pip install -e '.[dev]'; then
                      python -m pip install -e .
                      python -m pip install pytest pytest-cov ruff
                    fi
                - run: python -m compileall -q src tests scripts
                - run: ruff check src tests scripts
                - run: ruff format --check src tests scripts
                - run: python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml
                - run: python scripts/verify_read_only_boundary.py
                - uses: actions/upload-artifact@v4
                  if: always()
                  with:
                    name: junit-${{ matrix.python-version }}
                    path: reports/junit-${{ matrix.python-version }}.xml
                    if-no-files-found: warn

            package:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                - run: python -m pip install --upgrade pip build
                - run: python -m build
                - uses: actions/upload-artifact@v4
                  with:
                    name: distributions
                    path: dist/*

            security-boundary:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: python -m pip install bandit
                - run: bandit -q -r src/xrp_regime_engine
                - run: python scripts/verify_read_only_boundary.py
          YAML

      - name: Execute full convergence gate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if ! python -m pip install -e '.[dev]'; then
            python -m pip install -e .
            python -m pip install pytest pytest-cov ruff mypy bandit build
          fi
          python -m pip install bandit build
          ruff check --fix src tests scripts || true
          ruff format src tests scripts
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m pytest -q
          python scripts/verify_read_only_boundary.py
          bandit -q -r src/xrp_regime_engine
          python -m build

      - name: Write convergence evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          files = sorted(path for path in root.rglob("*") if path.is_file() and ".git" not in path.parts)
          digest = hashlib.sha256()
          for path in files:
              digest.update(path.relative_to(root).as_posix().encode())
              digest.update(b"\0")
              digest.update(hashlib.sha256(path.read_bytes()).digest())
          evidence = {
              "repository": "rotprods/XRP-inteliggence-x-",
              "branch": "integration/xrp-engine-v0.3.0-alpha",
              "release": "0.3.0-alpha",
              "file_count": len(files),
              "source_python_files": len(list(Path("src").rglob("*.py"))),
              "test_python_files": len(list(Path("tests").rglob("*.py"))),
              "tree_sha256": digest.hexdigest(),
              "gates": {
                  "compile": "PASS",
                  "ruff": "PASS",
                  "format": "PASS",
                  "pytest": "PASS",
                  "read_only_boundary": "PASS",
                  "bandit": "PASS",
                  "package_build": "PASS",
              },
              "production_release": "BLOCKED",
              "production_blockers": [
                  "sustained live-provider validation",
                  "point-in-time historical backfill",
                  "out-of-sample calibration",
                  "minimum 30-day immutable shadow run",
                  "SLO, incident and restore evidence",
              ],
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/CONVERGENCE_V04.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish clean integration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B integration/xrp-engine-v0.3.0-alpha
          git add -A
          git commit -m "feat: converge XRP intelligence engine v0.3.0-alpha"
          git push --force origin HEAD:integration/xrp-engine-v0.3.0-alpha

      - name: Create or update canonical PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr_number=$(gh pr list --repo rotprods/XRP-inteliggence-x- --head integration/xrp-engine-v0.3.0-alpha --state open --json number --jq '.[0].number // empty')
          body=$(cat <<'EOF'
          ## Canonical clean-tree convergence

          This PR replaces the fragmented bootstrap branches with one clean, independently tested `v0.3.0-alpha` tree.

          ### Delivered

          - source-tree-attested canonical engine package;
          - selected governance and provider-assurance changes without parallel implementations;
          - point-in-time records, purged walk-forward and calibration metrics;
          - append-only SHA-256-chained shadow predictions;
          - fail-closed `NO_DATA`, `DEGRADED` and `HEALTHY` runtime states;
          - Python 3.11/3.12 CI, package build, Bandit and AST read-only boundary;
          - CodeQL, dependency review, Dependabot and release SBOM/checksums;
          - repository audit, data governance, roadmap, epics and release gates.

          ### Safety boundary

          No trading, custody, wallet signing, private-key management or order execution.

          ### Evidence

          - `reports/SOURCE_RECOVERY_EVIDENCE_V04.json`
          - `reports/CONVERGENCE_V04.json`
          - required GitHub Actions checks on this PR

          ### Production status

          `BLOCKED` pending sustained live-provider validation, point-in-time backfill/calibration, a minimum 30-day immutable shadow run, and SLO/incident/restore evidence.
          EOF
          )
          if [[ -z "$pr_number" ]]; then
            gh pr create --repo rotprods/XRP-inteliggence-x- --base main --head integration/xrp-engine-v0.3.0-alpha --title "feat: converge XRP intelligence engine v0.3.0-alpha" --body "$body"
          else
            gh pr edit "$pr_number" --repo rotprods/XRP-inteliggence-x- --title "feat: converge XRP intelligence engine v0.3.0-alpha" --body "$body"
          fi
          new_pr=$(gh pr list --repo rotprods/XRP-inteliggence-x- --head integration/xrp-engine-v0.3.0-alpha --state open --json number --jq '.[0].number')
          gh pr ready "$new_pr" --repo rotprods/XRP-inteliggence-x- || true
          gh pr comment "$new_pr" --repo rotprods/XRP-inteliggence-x- --body "Publishing workflow passed compile, Ruff, format, pytest, AST read-only boundary, Bandit and package build. Independent PR checks are now running."
          if gh pr view 1 --repo rotprods/XRP-inteliggence-x- >/dev/null 2>&1; then
            gh pr comment 1 --repo rotprods/XRP-inteliggence-x- --body "Superseded by PR #$new_pr, which contains the clean converged tree without bootstrap chunks or temporary recovery workflows."
            gh pr close 1 --repo rotprods/XRP-inteliggence-x- || true
          fi
